name: Fehler melden
description: Etwas funktioniert nicht wie beschrieben.
labels: [bug]
body:
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - Spiegel
        - Spiegel-Brücke
        - Ringwerk
        - Betrieb (CLI, Deploy)
    validations:
      required: true
  - type: textarea
    id: was
    attributes:
      label: Was ist passiert?
      description: Was hast du getan, was hast du erwartet, was kam stattdessen?
    validations:
      required: true
  - type: input
    id: stand
    attributes:
      label: Stand
      description: Release oder Commit, Browser, Gerät. Bei der Brücke die Ausgabe von `spiegel-bridge version`.
  - type: markdown
    attributes:
      value: Bitte keine Namen, Sportpassnummern oder Schussdaten anderer Personen anhängen.
