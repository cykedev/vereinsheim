name: Vorschlag
description: Eine Idee für Spiegel, Ringwerk oder die Brücke.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Welches Problem löst das?
      description: Wer merkt es, wann, und was macht die Person heute stattdessen?
    validations:
      required: true
  - type: textarea
    id: idee
    attributes:
      label: Wie könnte es aussehen?
