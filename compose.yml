name: vereinsheim

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
      RINGWERK_HOST: ${RINGWERK_HOST}
      TREFFSICHER_HOST: ${TREFFSICHER_HOST}
      SPIEGEL_HOST: ${SPIEGEL_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    healthcheck:
      # 127.0.0.1 statt localhost: busybox-wget löst localhost nach ::1 auf,
      # das Caddy-Admin-API lauscht aber nur auf IPv4.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 64m
    logging: *default-logging
    networks:
      - web

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      RINGWERK_DB_PASSWORD: ${RINGWERK_DB_PASSWORD}
      TREFFSICHER_DB_PASSWORD: ${TREFFSICHER_DB_PASSWORD}
      SPIEGEL_DB_PASSWORD: ${SPIEGEL_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 384m
    logging: *default-logging
    networks:
      - data

  migrate-ringwerk:
    image: ${DOCKER_USER}/ringwerk:${RINGWERK_MIGRATOR_TAG:-latest-migrator}
    restart: "no"
    pull_policy: always
    environment:
      DATABASE_URL: postgresql://ringwerk:${RINGWERK_DB_PASSWORD}@db:5432/ringwerk
      PRISMA_AUTO_RESOLVE_FAILED_MIGRATIONS: "true"
      PRISMA_AUTO_RESOLVE_UNKNOWN_FAILED_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 192m
    logging: *default-logging
    networks:
      - data

  migrate-treffsicher:
    image: ${DOCKER_USER}/treffsicher:${TREFFSICHER_MIGRATOR_TAG:-latest-migrator}
    restart: "no"
    pull_policy: always
    environment:
      DATABASE_URL: postgresql://treffsicher:${TREFFSICHER_DB_PASSWORD}@db:5432/treffsicher
      PRISMA_AUTO_RESOLVE_FAILED_MIGRATIONS: "true"
      PRISMA_AUTO_RESOLVE_UNKNOWN_FAILED_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 192m
    logging: *default-logging
    networks:
      - data

  migrate-spiegel:
    image: ${DOCKER_USER}/spiegel:${SPIEGEL_MIGRATOR_TAG:-latest-migrator}
    restart: "no"
    pull_policy: always
    environment:
      DATABASE_URL: postgresql://spiegel:${SPIEGEL_DB_PASSWORD}@db:5432/spiegel
      # nur `prisma migrate deploy`, keine Wiederherstellung (apps/spiegel/scripts/run-migrations-with-recovery.sh)
      PRISMA_AUTO_RESOLVE_FAILED_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 192m
    logging: *default-logging
    networks:
      - data

  app-ringwerk:
    image: ${DOCKER_USER}/ringwerk:${RINGWERK_TAG:-latest}
    restart: unless-stopped
    pull_policy: always
    environment:
      DATABASE_URL: postgresql://ringwerk:${RINGWERK_DB_PASSWORD}@db:5432/ringwerk
      NEXTAUTH_SECRET: ${RINGWERK_NEXTAUTH_SECRET}
      NEXTAUTH_URL: https://${RINGWERK_HOST}
      SEED_ADMIN_EMAIL: ${RINGWERK_SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${RINGWERK_SEED_ADMIN_PASSWORD}
      DISPLAY_TIME_ZONE: ${DISPLAY_TIME_ZONE:-Europe/Berlin}
      AUTH_TRUST_PROXY_HEADERS: "true"
      # Heap unter der Grenze des Containers: Node 24 setzt ihn bei 256m sonst auf 259 MiB
      # (vault/incidents/node-heap-above-container-limit.md). Gilt für alle drei Apps;
      # Treffsicher hat mehr Luft (Uploads bis 10 MB, PDF-Import mit pdf.js im Prozess).
      NODE_OPTIONS: --max-old-space-size=160
    depends_on:
      db:
        condition: service_healthy
      migrate-ringwerk:
        condition: service_completed_successfully
    mem_limit: 256m
    logging: *default-logging
    networks:
      - web
      - data

  app-treffsicher:
    image: ${DOCKER_USER}/treffsicher:${TREFFSICHER_TAG:-latest}
    restart: unless-stopped
    pull_policy: always
    environment:
      DATABASE_URL: postgresql://treffsicher:${TREFFSICHER_DB_PASSWORD}@db:5432/treffsicher
      NEXTAUTH_SECRET: ${TREFFSICHER_NEXTAUTH_SECRET}
      NEXTAUTH_URL: https://${TREFFSICHER_HOST}
      ADMIN_EMAIL: ${TREFFSICHER_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${TREFFSICHER_ADMIN_PASSWORD}
      UPLOAD_DIR: /app/uploads
      DISPLAY_TIME_ZONE: ${DISPLAY_TIME_ZONE:-Europe/Berlin}
      AUTH_TRUST_PROXY_HEADERS: "true"
      NODE_OPTIONS: --max-old-space-size=192
    volumes:
      - uploads_treffsicher:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate-treffsicher:
        condition: service_completed_successfully
    mem_limit: 320m
    logging: *default-logging
    networks:
      - web
      - data

  app-spiegel:
    image: ${DOCKER_USER}/spiegel:${SPIEGEL_TAG:-latest}
    restart: unless-stopped
    pull_policy: always
    environment:
      DATABASE_URL: postgresql://spiegel:${SPIEGEL_DB_PASSWORD}@db:5432/spiegel
      NEXTAUTH_SECRET: ${SPIEGEL_NEXTAUTH_SECRET}
      NEXTAUTH_URL: https://${SPIEGEL_HOST}
      SEED_ADMIN_EMAIL: ${SPIEGEL_SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SPIEGEL_SEED_ADMIN_PASSWORD}
      DISPLAY_TIME_ZONE: ${DISPLAY_TIME_ZONE:-Europe/Berlin}
      AUTH_TRUST_PROXY_HEADERS: "true"
      NODE_OPTIONS: --max-old-space-size=160
    depends_on:
      db:
        condition: service_healthy
      migrate-spiegel:
        condition: service_completed_successfully
    mem_limit: 256m
    logging: *default-logging
    networks:
      - web
      - data

networks:
  web:
  data:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  uploads_treffsicher:
