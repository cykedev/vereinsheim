<!doctype html>
<meta charset="utf-8" />
<style>
  html,
  body {
    margin: 0;
    width: 1600px;
    height: 900px;
    overflow: hidden;
    background: #f4f5f7;
  }
  .desktop {
    position: absolute;
    left: 60px;
    top: 70px;
    width: 1180px;
    border-radius: 14px;
    box-shadow: 0 20px 60px rgba(27, 31, 39, 0.18);
    overflow: hidden;
  }
  .desktop img {
    display: block;
    width: 100%;
  }
  .phone {
    position: absolute;
    left: 1210px;
    top: 110px;
    width: 330px;
    padding: 14px;
    border-radius: 44px;
    background: #1b1f27;
    box-shadow: 0 20px 60px rgba(27, 31, 39, 0.28);
  }
  .phone img {
    display: block;
    width: 100%;
    border-radius: 32px;
  }
</style>
<div class="desktop"><img src="{{desktop}}" alt="" /></div>
<div class="phone"><img src="{{phone}}" alt="" /></div>
