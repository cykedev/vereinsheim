# Override für den lokalen Ende-zu-Ende-Test (tools/stack-e2e/run.sh), immer zusammen mit compose.yml und einer
# Wegwerf-Umgebung aus run.sh. Caddy hört auf Ports statt Hosts (RINGWERK_HOST=:8080 usw.), so geht es ohne DNS und
# TLS; 8081 ist die Hinweisseite von Treffsicher. Die Apps nehmen die lokal gebauten Images (vereinsheim-e2e/*) und
# holen nichts von Docker Hub. Die Grenzen kommen unverändert aus compose.yml.
services:
  caddy:
    ports: !override
      - "18080:8080"
      - "18081:8081"
      - "18082:8082"

  db:
    ports:
      - "15432:5432"

  migrate-ringwerk:
    pull_policy: never

  migrate-spiegel:
    pull_policy: never

  app-ringwerk:
    pull_policy: never
    environment:
      NEXTAUTH_URL: "http://localhost:18080"

  app-spiegel:
    pull_policy: never
    environment:
      NEXTAUTH_URL: "http://localhost:18082"

  transfer-spiegel:
    pull_policy: never
